  /* ==================== D03 法术符文槽 ==================== */
  .va-rune-slot {

  /* ==================== F02–F04 面板 / 按钮 / 徽记 ==================== */

    .wt-turn-notice { animation: wt-turn-notice-fade 2.9s linear forwards; }
  }
</style>

<script>
/* ============================================================
   场景构建 —— 几何移植自 packages/client/src/components/Prism3D.tsx
   （polygonPoints / clipFrom / 侧墙 transform / backface-visibility）
   尺寸一律取 game/visual3d.ts。
   ============================================================ */
(function () {
  'use strict';

  var VISUAL = {
    boardRadius: 460, boardHeight: 28, boardRimDepth: 34,
    tileRadius: 74, tileHeight: 10, tileRingRadius: 342,
    towerBaseWidth: 80, towerLayerHeight: 44, maxTowerLayers: 9,
    castleSize: 48, castleHeight: 48,
    wizardRadius: 8, wizardHeight: 30,
    cameraPitchDeg: 58, pitchMinDeg: 34, pitchMaxDeg: 72,
    zoomMin: 0.48, zoomMax: 3.2,
    worldSize: 980
  };
  var TILE_SURF_Z = VISUAL.boardHeight + VISUAL.tileHeight; // 38

  function el(tag, cls) {
    var d = document.createElement(tag);
    if (cls) d.className = cls;
    return d;
  }

  /* ---- Prism3D.tsx 同源几何 ---- */
  function polygonPoints(sides, radius, start) {
    var pts = [];
    for (var i = 0; i < sides; i++) {
      var a = start + (i / sides) * Math.PI * 2;
      pts.push({ x: Math.cos(a) * radius, y: Math.sin(a) * radius });
    }
    return pts;
  }
  function clipFrom(pts, r) {
    return 'polygon(' + pts.map(function (p) {
      return (((p.x + r) / (r * 2)) * 100).toFixed(2) + '% ' + (((p.y + r) / (r * 2)) * 100).toFixed(2) + '%';
    }).join(', ') + ')';
  }
  var OCTAGON_CLIP = 'polygon(30% 0%,70% 0%,100% 30%,100% 70%,70% 100%,30% 100%,0% 70%,0% 30%)';

  /* 逐面亮度（暖主光左下 / 冷补光右上）→ 侧墙叶子 filter */
  function faceShade(mx, my, r) {
    var d = (mx / r) * -0.55 + (my / r) * 0.65;
    return (0.8 + 0.38 * (d + 1) / 2).toFixed(3);
  }

  /* Prism3D：顶面 clip-path + N 片侧墙 translate3d(m) rotateZ(θ) rotateX(90deg) */
  function prism(o) {
    var wrap = el('div', 'pz-wrap');
    wrap.style.width = wrap.style.height = (o.radius * 2) + 'px';
    wrap.style.marginLeft = wrap.style.marginTop = -o.radius + 'px';
    wrap.style.transform = 'translate3d(' + (o.x || 0) + 'px,' + (o.y || 0) + 'px,' + (o.z || 0) + 'px)';
    var start = (o.start === undefined ? Math.PI / 8 : o.start);
    var pts = polygonPoints(o.sides, o.radius, start);
    var size = o.radius * 2;

    if (o.withTop !== false) {
      var top = el('div', 'pz-top ' + (o.topClass || ''));
      top.style.width = top.style.height = size + 'px';
      top.style.marginLeft = top.style.marginTop = -o.radius + 'px';
      top.style.clipPath = o.clip || clipFrom(pts, o.radius);
      top.style.transform = 'translateZ(' + o.height + 'px)';
      if (o.topZIndex) top.style.zIndex = o.topZIndex;
      wrap.appendChild(top);
    }

    for (var i = 0; i < pts.length; i++) {
      var p = pts[i], q = pts[(i + 1) % pts.length];
      var edge = Math.hypot(q.x - p.x, q.y - p.y);
      var mx = (p.x + q.x) / 2, my = (p.y + q.y) / 2;
      var angle = Math.atan2(q.y - p.y, q.x - p.x);
      var w = edge + 1;
      var side = el('div', 'pz-side ' + (o.sideClass || ''));
      side.style.width = w + 'px';
      side.style.height = o.height + 'px';
      side.style.marginLeft = -w / 2 + 'px';
      side.style.marginTop = -o.height / 2 + 'px';
      side.style.transformOrigin = 'center center';
      side.style.transform =
        'translate3d(' + mx + 'px,' + my + 'px,' + o.height / 2 + 'px) rotateZ(' + angle + 'rad) rotateX(90deg)';
      if (o.shade !== false) side.style.setProperty('--face-shade', faceShade(mx, my, o.radius));
      if (o.decorate) {
        var deco = o.decorate(i);
        if (deco) side.appendChild(deco);
      }
      wrap.appendChild(side);
    }
    return wrap;
  }

  /* ---- A01–A04 塔（Tower3D.tsx 同构：侧墙 + 顶面 + 8 城垛 + 渡鸦徽） ---- */
  function tower(x, y, layers, hasRaven, tier) {
    var g = el('div');
    for (var l = 0; l < layers; l++) {
      var brightness = 1 + Math.min(0.08, (tier + l) * 0.016);
      var layer = prism({
        sides: 8, radius: VISUAL.towerBaseWidth / 2, height: VISUAL.towerLayerHeight,
        x: x, y: y, z: TILE_SURF_Z + l * VISUAL.towerLayerHeight,
        withTop: false,
        sideClass: 'va-tower-side',
        decorate: function (i) {
          if (i !== 0 && i !== 4) return null;
          var bird = el('div', 'va-raven-bird');
          bird.style.cssText = 'position:absolute;left:38%;top:32%;width:9px;height:7px;opacity:0.55';
          return bird;
        }
      });
      // 层间提亮只作用于叶子面：与逐面光照相乘写回 --face-shade（不覆盖 .pz-side 的 filter）
      layer.querySelectorAll('.pz-side').forEach(function (n) {
        var shade = parseFloat(n.style.getPropertyValue('--face-shade')) || 1;
        n.style.setProperty('--face-shade', (shade * brightness).toFixed(3));
        if (hasRaven) {
          n.style.setProperty('--side-top', '#93a4c0');
          n.style.setProperty('--side-bottom', '#7486a6');
        }
      });
      g.appendChild(layer);

      // A03 顶面（仅顶层展示面 + 城垛 + 纹章；中间层被上层盖住）
      var topFace = el('div', 'pz-top va-tower-face');
      if (hasRaven) topFace.setAttribute('data-variant', 'raven');
      topFace.style.width = topFace.style.height = VISUAL.towerBaseWidth + 'px';
      topFace.style.left = topFace.style.top = '50%';
      topFace.style.marginLeft = topFace.style.marginTop = -VISUAL.towerBaseWidth / 2 + 'px';
      topFace.style.clipPath = OCTAGON_CLIP;
      topFace.style.transform = 'translate3d(' + x + 'px,' + y + 'px,' + (TILE_SURF_Z + (l + 1) * VISUAL.towerLayerHeight) + 'px)';
      topFace.style.filter = 'brightness(' + brightness + ')';
      g.appendChild(topFace);

      // A03 城垛 ×8（半径 30，不压 3×2 巫师位）
      for (var b = 0; b < 8; b++) {
        var ba = Math.PI / 8 + (b / 8) * Math.PI * 2;
        var bt = el('div', 'va-battlement');
        if (hasRaven) bt.setAttribute('data-variant', 'raven');
        bt.style.cssText = 'position:absolute;left:50%;top:50%;width:8px;height:8px;margin:-4px 0 0 -4px;' +
          'transform:translate3d(' + (x + Math.cos(ba) * 30) + 'px,' + (y + Math.sin(ba) * 30) + 'px,' +
          (TILE_SURF_Z + (l + 1) * VISUAL.towerLayerHeight + 4) + 'px)';
        g.appendChild(bt);
      }

      // A02 渡鸦蓝圆徽（顶层）
      if (hasRaven && l === layers - 1) {
        var crest = el('div', 'va-raven');
        crest.style.cssText = 'position:absolute;width:18px;height:18px;display:flex;align-items:center;justify-content:center;' +
          'transform:translate3d(' + (x + 13) + 'px,' + (y - 13) + 'px,' + (TILE_SURF_Z + (l + 1) * VISUAL.towerLayerHeight + 6) + 'px)';
        var cb = el('div', 'va-raven-bird');
        cb.style.cssText = 'width:11px;height:8px;opacity:0.9';
        crest.appendChild(cb);
        g.appendChild(crest);
      }
    }
    return g;
  }

  /* ---- A05 鸦堡（八边柱 + 收缩锥顶 + 金窗 + 门 + 旗） ---- */
  function castle(x, y, zTop) {
    var g = el('div');
    var size = VISUAL.castleSize;
    var bodyH = 26;
    g.appendChild(prism({
      sides: 8, radius: size / 2, height: bodyH, x: x, y: y, z: zTop,
      sideClass: 'va-castle-side', topClass: 'va-castle-side',
      decorate: function (i) {
        var frag = document.createDocumentFragment();
        if (i === 2 || i === 6) {
          var win = el('div', 'va-window');
          win.style.cssText = 'position:absolute;width:6px;height:9px;left:50%;top:30%;margin-left:-3px';
          frag.appendChild(win);
        }
        if (i === 4) {
          var door = el('div', 'va-door');
          door.style.cssText = 'position:absolute;width:10px;height:13px;left:50%;bottom:0;margin-left:-5px';
          frag.appendChild(door);
        }
        return frag;
      }
    }));
    // 7 层收缩八边形圆盘成锥顶（A05）
    var radii = [26, 22, 18, 14, 10, 7, 4];
    for (var i = 0; i < radii.length; i++) {
      g.appendChild(prism({
        sides: 8, radius: radii[i], height: 3, x: x, y: y,
        z: zTop + bodyH + i * 3,
        topClass: 'va-roof', sideClass: 'va-roof'
      }));
    }
    // 旗杆 + 渡鸦旗
    var pole = el('div');
    pole.style.cssText = 'position:absolute;width:2px;height:16px;background:var(--va-metal);left:50%;top:50%;' +
      'transform:translate3d(' + x + 'px,' + y + 'px,' + (zTop + bodyH + 21 + 8) + 'px)';
    g.appendChild(pole);
    var flag = el('div', 'va-castle-flag');
    flag.style.cssText = 'position:absolute;width:12px;height:8px;left:50%;top:50%;' +
      'transform:translate3d(' + (x + 7) + 'px,' + y + 'px,' + (zTop + bodyH + 30) + 'px)';
    g.appendChild(flag);
    return g;
  }

  /* ---- B01 巫师（Wizard3D.tsx 同构：rotateX(-90deg) 立起 + 4 片袍身 + 4 片帽锥 + 帽檐） ---- */
  function wizard(x, y, surfaceZ, color, highlight) {
    var g = el('div');
    var width = VISUAL.wizardRadius * 2;
    var height = VISUAL.wizardHeight;
    var hatHeight = height * 0.4;
    var robeHeight = height - hatHeight;

    var wrap = el('div', 'wizard-piece' + (highlight ? ' va-wizard-highlight' : ''));
    // Space.tsx 约定：rotateX(-90deg) 立起，中心 z = 面高 + 身高/2
    wrap.style.cssText = 'position:absolute;left:50%;top:50%;width:' + width + 'px;height:' + height + 'px;' +
      'margin:' + (-height / 2) + 'px 0 0 ' + (-width / 2) + 'px;' +
      'transform-style:preserve-3d;' +
      'transform:translate3d(' + x + 'px,' + y + 'px,' + (surfaceZ + height / 2) + 'px) rotateX(-90deg)';
    wrap.style.setProperty('--robe', color);
    wrap.style.setProperty('--hat', color);

    // 底部软投影 + B02 金环（叶子）
    var shadow = el('div');
    shadow.style.cssText = 'position:absolute;left:-3px;right:-3px;bottom:-2px;height:6px;border-radius:50%;' +
      'background:' + (highlight
        ? 'radial-gradient(ellipse at 50% 50%, rgba(240,184,74,0.55) 0%, transparent 72%);border:1px solid rgba(240,184,74,0.85)'
        : 'radial-gradient(ellipse at 50% 50%, rgba(0,0,0,0.45) 0%, transparent 72%)');
    wrap.appendChild(shadow);

    for (var i = 0; i < 4; i++) {
      var robe = el('div', 'va-wizard-robe');
      robe.style.cssText = 'position:absolute;left:0;bottom:0;width:' + width + 'px;height:' + robeHeight + 'px;' +
        'transform-origin:50% 100%;transform:rotateY(' + (i * 45) + 'deg);backface-visibility:hidden';
      var face = el('div', 'va-wizard-face');
      face.style.cssText = 'position:absolute;left:50%;top:18%;width:7px;height:8px;margin-left:-3.5px';
      robe.appendChild(face);
      wrap.appendChild(robe);
    }
    for (var h = 0; h < 4; h++) {
      var hat = el('div', 'va-wizard-hat');
      hat.style.cssText = 'position:absolute;left:1px;top:0;width:' + (width - 2) + 'px;height:' + (hatHeight + 3) + 'px;' +
        'transform-origin:50% 100%;transform:rotateY(' + (h * 45) + 'deg);backface-visibility:hidden';
      wrap.appendChild(hat);
    }
    var brim = el('div', 'va-wizard-brim');
    brim.style.cssText = 'position:absolute;left:50%;top:' + (hatHeight - 1) + 'px;width:' + (width - 1) + 'px;height:' + (width - 1) + 'px;' +
      'margin-left:' + (-(width - 1) / 2) + 'px;margin-top:' + (-(width - 1) / 4) + 'px';
    wrap.appendChild(brim);

    g.appendChild(wrap);
    return g;
  }

  /* ---- 场景组装 ---- */
  function buildScene() {
    var world = el('div', 'wt-stage-world');
    world.id = 'world';
    var frag = document.createDocumentFragment();

    // E02 棋盘底座 + 环形石轨
    frag.appendChild(prism({
      sides: 64, radius: VISUAL.boardRadius, height: VISUAL.boardHeight, z: 0, start: 0,
      topClass: 'va-board-base', sideClass: 'va-board-rim', shade: false
    }));

    // E01 十六格环形地块
    var tilePos = [];
    for (var i = 0; i < 16; i++) {
      var a = (i / 16) * Math.PI * 2 - Math.PI / 2;
      var x = Math.cos(a) * VISUAL.tileRingRadius;
      var y = Math.sin(a) * VISUAL.tileRingRadius;
      tilePos.push({ x: x, y: y });
      var ravenGround = (i === 4 || i === 12);
      frag.appendChild(prism({
        sides: 16, radius: VISUAL.tileRadius, height: VISUAL.tileHeight,
        x: x, y: y, z: VISUAL.boardHeight, start: Math.PI / 16,
        topClass: 'va-tile-face', sideClass: 'va-tile-side',
        topZIndex: 1
      }));
      var top = frag.lastChild.querySelector('.pz-top');
      if (ravenGround && top) top.setAttribute('data-variant', 'raven');
      frag.lastChild.querySelectorAll('.pz-side').forEach(function (n) {
        if (ravenGround) n.setAttribute('data-variant', 'raven');
      });

      // C01 地面渡鸦纹章（raven 地块）
      if (ravenGround) {
        var crest = prism({
          sides: 16, radius: 10, height: 3, x: x + 18, y: y - 12,
          z: TILE_SURF_Z, start: Math.PI / 16,
          topClass: 'va-raven', sideClass: 'va-castle-side', shade: false
        });
        crest.style.zIndex = 30;
        frag.appendChild(crest);
      }
    }

    // C05 三态环：金目标 / 绿可选 / 蓝纹章（带 2px 侧壁厚度）
    function ring(idx, cls, r, z, color) {
      var p = tilePos[idx];
      var wrap = prism({
        sides: 32, radius: r, height: 2, x: p.x, y: p.y, z: z, start: 0,
        withTop: false, sideClass: 'va-ring-wall', shade: false
      });
      wrap.style.setProperty('--ring-color', color);
      wrap.style.zIndex = 2;
      var disc = el('div', cls);
      disc.style.cssText = 'position:absolute;left:50%;top:50%;width:' + (r * 2 - 6) + 'px;height:' + (r * 2 - 6) + 'px;' +
        'margin:' + (-(r - 3)) + 'px 0 0 ' + (-(r - 3)) + 'px;' +
        'transform:translate3d(' + p.x + 'px,' + p.y + 'px,' + (z + 2) + 'px);pointer-events:none';
      disc.style.zIndex = 2;
      frag.appendChild(wrap);
      frag.appendChild(disc);
    }
    ring(12, 'va-ring target', 33, TILE_SURF_Z, '#f0b84a');
    ring(5, 'va-ring selectable', 33, TILE_SURF_Z, '#3cb86a');
    ring(8, 'va-ring raven', 33, TILE_SURF_Z, '#8fc0ff');

    // 塔群：2 层（纹章塔）/ 1 层 / 3 层 + 鸦堡 / 5 层悬浮塔
    frag.appendChild(tower(tilePos[1].x, tilePos[1].y, 2, true, 0));
    frag.appendChild(tower(tilePos[6].x, tilePos[6].y, 1, false, 0));
    frag.appendChild(tower(tilePos[11].x, tilePos[11].y, 3, false, 1));

    // A05 鸦堡落在 3 层塔顶
    var castleZ = TILE_SURF_Z + 3 * VISUAL.towerLayerHeight;
    frag.appendChild(castle(tilePos[11].x, tilePos[11].y, castleZ));

    // A06 悬浮 5 层塔：升腾魔力环 + 脱离阴影 + 星屑
    // 注意：带 keyframes 动画的元素不能直接挂 translate3d（动画 transform 会覆盖定位），
    // 一律套一层 holder 做空间定位（与 .va-flame 同法）。
    var fx = tilePos[3].x, fy = tilePos[3].y;
    frag.appendChild(tower(fx, fy, 5, false, 2));
    var levHolder = el('div');
    levHolder.style.cssText = 'position:absolute;left:50%;top:50%;width:104px;height:104px;margin:-52px 0 0 -52px;' +
      'transform:translate3d(' + fx + 'px,' + fy + 'px,' + (TILE_SURF_Z + 2) + 'px)';
    var lev = el('div', 'va-levitate');
    lev.style.cssText = 'position:absolute;inset:0';
    levHolder.appendChild(lev);
    frag.appendChild(levHolder);
    var levShadow = el('div', 'va-levitate-shadow');
    levShadow.style.cssText = 'position:absolute;left:50%;top:50%;width:120px;height:120px;margin:-60px 0 0 -60px;' +
      'transform:translate3d(' + fx + 'px,' + fy + 'px,' + (TILE_SURF_Z + 1) + 'px)';
    frag.appendChild(levShadow);
    for (var s = 0; s < 6; s++) {
      var sa = (s / 6) * Math.PI * 2;
      var sparkHolder = el('div');
      sparkHolder.style.cssText = 'position:absolute;left:50%;top:50%;width:2px;height:2px;' +
        'transform:translate3d(' + (fx + Math.cos(sa) * 58) + 'px,' + (fy + Math.sin(sa) * 58) + 'px,' +
        (TILE_SURF_Z + 30 + s * 22) + 'px)';
      var spark = el('div', 'va-spark');
      if (s % 3 === 0) spark.setAttribute('data-tone', 'ruby');
      spark.style.animationDelay = (s * 0.6) + 's';
      sparkHolder.appendChild(spark);
      frag.appendChild(sparkHolder);
    }

    // 巫师：地面 3 名 + 纹章塔顶 1 名（P1 选中高亮）
    frag.appendChild(wizard(tilePos[4].x - 12, tilePos[4].y + 8, TILE_SURF_Z, '#e06450', true));
    frag.appendChild(wizard(tilePos[9].x, tilePos[9].y, TILE_SURF_Z, '#4aa3e0', false));
    frag.appendChild(wizard(tilePos[0].x + 10, tilePos[0].y + 6, TILE_SURF_Z, '#3cb86a', false));
    frag.appendChild(wizard(tilePos[1].x - 10, tilePos[1].y + 8,
      TILE_SURF_Z + 2 * VISUAL.towerLayerHeight, '#ecc44f', false));

    // C04 烛焰起始标记 ×2（外层 rotateX(-90deg) 立起，与素材台同构）
    [[7, -22, 12], [15, 18, -10]].forEach(function (f) {
      var p = tilePos[f[0]];
      var holder = el('div');
      holder.style.cssText = 'position:absolute;left:50%;top:50%;width:11px;height:14px;margin:-7px 0 0 -5.5px;' +
        'transform:translate3d(' + (p.x + f[1]) + 'px,' + (p.y + f[2]) + 'px,' + (TILE_SURF_Z + 7) + 'px) rotateX(-90deg)';
      var flame = el('div', 'va-flame');
      holder.appendChild(flame);
      var base = el('div', 'va-flame-holder');
      holder.appendChild(base);
      frag.appendChild(holder);
    });

    world.appendChild(frag);
    return world;
  }

  /* ---- 相机：拖拽 rotateZ / 俯角 34–72° / 滚轮缩放 0.48–3.2（StageViewport 同参数） ---- */
  var viewport = document.getElementById('viewport');
  var worldEl = document.getElementById('world');
  worldEl.replaceWith(buildScene());
  worldEl = document.getElementById('world');

  // 初始缩放按 fitWorldZoom 口径适配视口（effectiveSize ≈ 1491）
  var fit = Math.min(viewport.clientWidth, viewport.clientHeight * 1.4) / 1491;
  var cam = {
    rotation: -22,
    pitch: VISUAL.cameraPitchDeg,
    zoom: Math.min(VISUAL.zoomMax, Math.max(VISUAL.zoomMin, fit))
  };

  function applyCam() {
    worldEl.style.transform =
      'rotateX(' + cam.pitch + 'deg) rotateZ(' + cam.rotation + 'deg) scale(' + cam.zoom + ')';
  }
  applyCam();

  var dragging = false, lastX = 0, lastY = 0;
  viewport.addEventListener('pointerdown', function (e) {
    dragging = true; lastX = e.clientX; lastY = e.clientY;
    viewport.classList.add('dragging');
    viewport.setPointerCapture(e.pointerId);
  });
  viewport.addEventListener('pointermove', function (e) {
    if (!dragging) return;
    cam.rotation += (e.clientX - lastX) * 0.35;
    cam.pitch = Math.min(VISUAL.pitchMaxDeg, Math.max(VISUAL.pitchMinDeg, cam.pitch - (e.clientY - lastY) * 0.18));
    lastX = e.clientX; lastY = e.clientY;
    applyCam();
  });
  viewport.addEventListener('pointerup', function () {
    dragging = false;
    viewport.classList.remove('dragging');
  });
  viewport.addEventListener('wheel', function (e) {
    e.preventDefault();
    var step = e.deltaY < 0 ? 1.1 : 1 / 1.1;
    cam.zoom = Math.min(VISUAL.zoomMax, Math.max(VISUAL.zoomMin, cam.zoom * step));
    applyCam();
  }, { passive: false });
})();
</script>
</body>
